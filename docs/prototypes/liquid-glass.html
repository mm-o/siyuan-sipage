<body>
<svg class="filters" aria-hidden="true"><defs><filter id="lens-hero" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB"><feImage id="lens-map" width="100%" height="100%" preserveAspectRatio="none" result="map"/><feDisplacementMap in="SourceGraphic" in2="map" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<main>
  <div class="topline"><div class="wordmark"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-panels-top-left-icon lucide-panels-top-left"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg> 桌面卡片</div><span class="tag">BUTTON STUDY · 01</span></div>
  <h1>一枚按钮，先看质感。</h1>
  <p class="intro">透出背景的颜色，边缘留一点光。移动鼠标、按下按钮，感受它的变化。</p>
  <div class="controlbar">
    <div class="switcher" role="group" aria-label="背景"><button type="button" data-theme="photo" aria-pressed="true">山景</button><button type="button" data-theme="light" aria-pressed="false">浅色</button><button type="button" data-theme="dark" aria-pressed="false">深色</button></div>
    <label class="comparison"><input id="compare" type="checkbox">对比普通毛玻璃</label>
  </div>
  <section class="scene" data-theme="photo" data-material="liquid" aria-label="按钮效果预览">
    <div class="backdrop"></div><div class="veil"></div>
    <header class="scene-head"><strong><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-layout-grid-icon lucide-layout-grid"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg> 我的桌面</strong><span class="scene-meta">留一点空白，给新的想法</span></header>
    <div class="time"><strong>17:10</strong><span>11月22日 星期日</span></div>
    <div class="sample"><button class="glass liquid hero" type="button" aria-label="完成整理"><span class="lens" aria-hidden="true"></span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-check-icon lucide-check"><path d="M20 6 9 17l-5-5"></path></svg><span>完成整理</span></button><span class="sample-label" id="sample-label">清透玻璃 · 轻折射 · 边缘高光</span></div>
    <div class="variants">
      <div class="variant"><button class="glass" type="button"><span class="lens" aria-hidden="true"></span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg><span>重置</span></button><small>默认</small></div>
      <div class="variant"><button class="glass primary" type="button"><span class="lens" aria-hidden="true"></span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-plus-icon lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg><span>添加卡片</span></button><small>主要</small></div>
      <div class="variant"><button class="glass danger" type="button"><span class="lens" aria-hidden="true"></span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-trash2-icon lucide-trash-2"><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg><span>移除</span></button><small>危险</small></div>
      <div class="variant"><button class="glass icon-only toggle" type="button" aria-label="钉住" aria-pressed="false"><span class="lens" aria-hidden="true"></span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-pin-icon lucide-pin"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg></button><small>图标</small></div>
      <div class="variant"><button class="glass disabled" type="button" disabled><span class="lens" aria-hidden="true"></span><span>保存</span></button><small>禁用</small></div>
    </div>
  </section>
  <div class="footer"><div class="features"><span>折射边缘</span><span>透明高光</span><span>轻按反馈</span><span>浅深色适配</span></div><span class="status" id="status" role="status" aria-live="polite">可交互预览</span></div>
  <p class="hint">网页内的液态玻璃材质样板 · 效果不依赖外部网络</p>
</main>
<script>
const scene=document.querySelector('.scene');
for(const button of document.querySelectorAll('.switcher button'))button.addEventListener('click',()=>{scene.dataset.theme=button.dataset.theme;document.querySelectorAll('.switcher button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))});
document.querySelector('#compare').addEventListener('change',event=>{scene.dataset.material=event.target.checked?'frosted':'liquid';document.querySelector('#sample-label').textContent=event.target.checked?'普通毛玻璃 · 均匀模糊':'清透玻璃 · 轻折射 · 边缘高光'});
for(const button of document.querySelectorAll('.glass:not(:disabled)')){
  button.addEventListener('pointermove',event=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=button.getBoundingClientRect();button.style.setProperty('--glow-x',`${Math.round((event.clientX-r.left)/r.width*100)}%`);button.style.setProperty('--glow-y',`${Math.round((event.clientY-r.top)/r.height*100)}%`)});
  button.addEventListener('pointerleave',()=>{button.style.removeProperty('--glow-x');button.style.removeProperty('--glow-y')});
  button.addEventListener('click',()=>{const label=button.getAttribute('aria-label')||button.textContent.trim();if(button.classList.contains('toggle'))button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true'));document.querySelector('#status').textContent=`${label} · 已响应`;const flash=document.createElement('span');flash.className='ripple';button.append(flash);setTimeout(()=>flash.remove(),350)});
}
// 圆角胶囊边缘的法线位移图：中心保持透视，弯曲只集中在边缘。
const canvas=document.createElement('canvas');canvas.width=436;canvas.height=136;const ctx=canvas.getContext('2d');const data=ctx.createImageData(canvas.width,canvas.height);const w=canvas.width,h=canvas.height,r=h/2;
for(let y=0;y<h;y++)for(let x=0;x<w;x++){const px=x+.5,py=y+.5,cx=Math.max(r,Math.min(w-r,px)),cy=r,dx=px-cx,dy=py-cy,d=Math.hypot(dx,dy),depth=r-d;let strength=0;if(depth>0&&depth<22)strength=Math.sin(Math.PI*depth/22)*.82;const i=(y*w+x)*4;data.data[i]=Math.round(128+(d?dx/d:0)*strength*127);data.data[i+1]=Math.round(128+(d?dy/d:0)*strength*127);data.data[i+2]=128;data.data[i+3]=255}ctx.putImageData(data,0,0);document.querySelector('#lens-map').setAttribute('href',canvas.toDataURL());
</script>
</body>
